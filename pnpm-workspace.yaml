# Supply-chain hardening (pnpm settings live here since pnpm 10).

# Never resolve a version published less than 3 days ago (minutes).
minimumReleaseAge: 4320

# Install scripts are blocked unless a package is listed here.
onlyBuiltDependencies: []

peerDependencyRules:
  allowedVersions:
    # ESLint 9 is end-of-life. eslint-config-next 16.4's plugins (react,
    # import, jsx-a11y) still declare eslint <=9 but run on 10 (verified on
    # 2026-10-30). Drop this once their peer ranges include 10.
    eslint: "10"
